# Example contracts (SPEC §9.5) and test contracts (testing/): an independent cargo workspace, compiled to wasm32-unknown-unknown.
#
# Building one contract (must be run inside the contracts/ directory so that the linker arguments in .cargo/config.toml
# are picked up; compiling only as cdylib is recommended, see the crate docs of ksana-contract-sdk):
#   cd contracts && cargo rustc --release --locked --target wasm32-unknown-unknown \
#       --package token --crate-type cdylib
# `cargo build` is not recommended: it also produces the rlib listed in the manifest, LTO cannot internalize symbols and the
# module gets noticeably larger (D-021; since D-073 such a module is no longer rejected at deployment).
# Native unit tests (using the SDK's in-memory mock host):
#   cargo test --manifest-path contracts/Cargo.toml
# ksana-test-contracts in the main workspace builds each contract the same way in its build.rs and exports the .wasm as
# byte constants.

[workspace]
resolver = "2"
members = ["examples/*", "testing/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ksana-contract-sdk = { path = "../crates/ksana-contract-sdk" }
token = { path = "examples/token" }

[workspace.lints.rust]
# The `#[no_mangle]` export functions generated by `entry!` carry their own `#[allow(unsafe_code)]`.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Contract logic uses only integers and checked arithmetic; out-of-bounds access and overflow always return an error (revert).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
