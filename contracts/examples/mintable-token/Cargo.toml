[package]
name = "mintable-token"
description = "Ksana example contract: a token issued as a VM built-in asset that its owner can mint up to an optional cap and its holders can burn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the wasm contract; rlib: linked by the native unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
ksana-contract-sdk.workspace = true

[lints]
workspace = true
