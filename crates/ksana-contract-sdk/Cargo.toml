[package]
name = "ksana-contract-sdk"
description = "Ksana contract development kit: host function wrappers, Borsh encoding/decoding, BTC Merkle proof verification (no_std, compiled to wasm32)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
borsh.workspace = true

# Non-wasm32 targets use the in-memory mock host (the `mock` module, for native unit tests), which needs real SHA-256
# and BIP340 signature verification. On wasm32 these two are provided by the host functions `sha256` / `verify_schnorr`
# and are not compiled into the contract.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2.workspace = true
secp256k1.workspace = true

# The token standards (docs/STANDARDS.md, D-120): the modules `standard`, `ks20`, `ks721` and, on native targets,
# `conformance` (compiled for this crate's own unit tests too). Off by default: declaring them changes the module of a
# contract that does not use them, such as the contract playground's shipped examples (D-119).
[features]
standards = []

[dev-dependencies]
hex.workspace = true
proptest.workspace = true
serde_json.workspace = true
# This crate's own tests and examples are built with the `standards` modules: the shared vectors of the token standards
# (examples/gen_standard_vectors, tests/standard_vectors.rs) come from them.
ksana-contract-sdk = { path = ".", features = ["standards"] }

# Does not inherit the workspace's `unsafe_code = "forbid"`: the wasm32 backend must use unsafe to call host functions
# and to implement the global allocator and `ksana_alloc`, and forbid cannot be relaxed at module level. Here it is deny
# instead, with explicit allow only on the wasm32-only module (src/wasm.rs) and the exported functions generated by
# `entry!`.
[lints.rust]
unsafe_code = "deny"
